<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd6c2"/>
      <stop offset="1" stop-color="#3fae96"/>
    </linearGradient>
    <pattern id="cork" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect width="22" height="22" fill="#f3c88e"/>
      <circle cx="5" cy="6" r="1.8" fill="#dca468"/>
      <circle cx="15" cy="15" r="1.5" fill="#dca468"/>
      <circle cx="17" cy="4" r="1.1" fill="#e6b67b"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- 脚 -->
  <rect x="146" y="330" width="26" height="104" rx="13" fill="#a8672f"/>
  <rect x="340" y="330" width="26" height="104" rx="13" fill="#a8672f"/>

  <!-- 掲示板（木枠＋コルク） -->
  <rect x="80" y="118" width="352" height="252" rx="36" fill="#1f7f6b" opacity=".25" transform="translate(0 10)"/>
  <rect x="80" y="112" width="352" height="252" rx="36" fill="#c98a4b"/>
  <rect x="100" y="132" width="312" height="212" rx="22" fill="url(#cork)"/>

  <!-- ピンクのメモ（ハート） -->
  <g transform="rotate(-7 168 210)">
    <rect x="122" y="166" width="94" height="94" rx="12" fill="#c77a43" opacity=".25" transform="translate(3 5)"/>
    <rect x="122" y="166" width="94" height="94" rx="12" fill="#ffa8bd"/>
    <path d="M169 238c-20-13-29-23-29-35 0-8 6-14 14-14 6 0 11 4 15 9 4-5 9-9 15-9 8 0 14 6 14 14 0 12-9 22-29 35z" fill="#ff5f86"/>
  </g>

  <!-- 黄色のメモ（文字） -->
  <g transform="rotate(5 284 196)">
    <rect x="232" y="148" width="104" height="96" rx="12" fill="#c77a43" opacity=".25" transform="translate(3 5)"/>
    <rect x="232" y="148" width="104" height="96" rx="12" fill="#ffe37a"/>
    <rect x="250" y="180" width="68" height="9" rx="4.5" fill="#d9a92e"/>
    <rect x="250" y="198" width="68" height="9" rx="4.5" fill="#d9a92e"/>
    <rect x="250" y="216" width="42" height="9" rx="4.5" fill="#d9a92e"/>
  </g>

  <!-- ミントのメモ（にっこり） -->
  <g transform="rotate(-4 350 284)">
    <rect x="306" y="244" width="88" height="82" rx="12" fill="#c77a43" opacity=".25" transform="translate(3 5)"/>
    <rect x="306" y="244" width="88" height="82" rx="12" fill="#c4f0d2"/>
    <circle cx="334" cy="280" r="6" fill="#2f8f72"/>
    <circle cx="366" cy="280" r="6" fill="#2f8f72"/>
    <path d="M334 296q16 14 32 0" fill="none" stroke="#2f8f72" stroke-width="6" stroke-linecap="round"/>
    <circle cx="324" cy="294" r="6" fill="#ffa8bd" opacity=".8"/>
    <circle cx="376" cy="294" r="6" fill="#ffa8bd" opacity=".8"/>
  </g>

  <!-- 水色のメモ（星） -->
  <g transform="rotate(6 196 304)">
    <rect x="160" y="276" width="72" height="56" rx="10" fill="#c77a43" opacity=".25" transform="translate(3 4)"/>
    <rect x="160" y="276" width="72" height="56" rx="10" fill="#a9dcff"/>
    <path d="M196 288l6 12 13 2-9.5 9 2.3 13-11.8-6.2-11.8 6.2 2.3-13-9.5-9 13-2z" fill="#4a9be0"/>
  </g>

  <!-- 画びょう -->
  <g>
    <circle cx="166" cy="170" r="13" fill="#ff6b5e"/>
    <circle cx="162" cy="166" r="4.5" fill="#fff" opacity=".7"/>
    <circle cx="286" cy="152" r="13" fill="#4a9be0"/>
    <circle cx="282" cy="148" r="4.5" fill="#fff" opacity=".7"/>
    <circle cx="350" cy="246" r="12" fill="#ffb02e"/>
    <circle cx="346" cy="242" r="4" fill="#fff" opacity=".7"/>
    <circle cx="196" cy="278" r="10" fill="#ff6b5e"/>
    <circle cx="193" cy="275" r="3.5" fill="#fff" opacity=".7"/>
  </g>
</svg>
